<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUALITY Spark</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <div class="logo">
                    <div class="logo-icon">D</div>
                    <h1>DUALITY Spark</h1>
                </div>
                <p class="subtitle">Global Chat Access</p>

                <div class="google-signin-wrapper">
                    <p class="signin-info">Sign in with your authorized Google account</p>

                    <button id="google-signin-btn" class="btn-google">
                        <svg viewBox="0 0 24 24" width="20" height="20">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span>Sign in with Google</span>
                    </button>
                </div>

                <div id="login-error" class="error-message hidden"></div>

                <div class="authorized-note">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                    <span>Access restricted to authorized accounts only</span>
                </div>
            </div>
        </div>

        <!-- Chat Portal Screen -->
        <div id="portal-screen" class="screen">
            <header class="portal-header">
                <div class="header-left">
                    <div class="logo-small">D</div>
                    <h1>DUALITY Spark</h1>
                </div>
                <div class="header-right">
                    <div class="connection-status" id="connection-status">
                        <span class="status-dot"></span>
                        <span class="status-text">Connecting...</span>
                    </div>
                    <button id="logout-btn" class="btn-logout">Logout</button>
                </div>
            </header>

            <main class="chat-main">
                <div class="chat-container">
                    <div id="messages-container" class="messages-container">
                        <div class="welcome-msg">
                            <h2>Spark Connected</h2>
                            <p>Send messages to your DUALITY system from anywhere.</p>
                        </div>
                    </div>

                    <form id="chat-form" class="chat-form">
                        <div class="input-wrapper">
                            <textarea
                                id="message-input"
                                placeholder="Type your message..."
                                rows="1"
                                autofocus
                            ></textarea>
                            <button type="submit" id="send-btn" class="send-btn">
                                <svg viewBox="0 0 24 24" width="24" height="24">
                                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script src="js/config.js"></script>
    <script src="js/auth-firebase.js"></script>
    <script src="js/spark-chat.js"></script>
    <script src="js/app-spark.js"></script>
</body>
</html>
